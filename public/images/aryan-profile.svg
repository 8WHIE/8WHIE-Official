<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" fill="none">
  <!-- Minimalist Laboratory Founder Profile Placeholder -->
  <rect width="600" height="750" fill="#0C0C0C"/>
  
  <!-- Subtle coordinate grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="300" y1="200" x2="300" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B7FF00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#B7FF00" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#grid)" />
  
  <!-- Ambient glow backdrop -->
  <circle cx="300" cy="320" r="180" fill="url(#glow)"/>
  
  <!-- Stylized Geometric Silhouette & Lab Reticle -->
  <!-- Outer reticle -->
  <circle cx="300" cy="300" r="140" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="300" cy="300" r="110" stroke="#B7FF00" stroke-opacity="0.3" stroke-width="1.5"/>
  
  <!-- Corner registration marks -->
  <path d="M 30 50 L 30 30 L 50 30" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>
  <path d="M 570 50 L 570 30 L 550 30" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>
  <path d="M 30 700 L 30 720 L 50 720" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>
  <path d="M 570 700 L 570 720 L 550 720" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>
  
  <!-- Monogram Initials AT -->
  <text x="300" y="325" fill="#F2F2F2" font-family="'Space Grotesk', monospace" font-size="72" font-weight="700" letter-spacing="0.1em" text-anchor="middle">AT</text>

  <!-- Technical identification markers -->
  <rect x="230" y="470" width="140" height="28" rx="2" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.15"/>
  <text x="300" y="488" fill="#B7FF00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" letter-spacing="0.15em" text-anchor="middle">FOUNDER // 8WHIE</text>

  <text x="300" y="550" fill="#F2F2F2" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600" letter-spacing="0.08em" text-anchor="middle">ARYAN THAKUR</text>
  <text x="300" y="580" fill="#929292" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Patna, India · Research &amp; Security</text>

  <!-- Bottom status note -->
  <text x="300" y="680" fill="#929292" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="0.05em" text-anchor="middle" fill-opacity="0.6">[ OFFICIAL PROFILE IMAGE SLOT — ARYAN-PROFILE.JPG ]</text>
</svg>
